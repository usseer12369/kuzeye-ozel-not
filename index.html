<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f8">
  <title>Sana özel 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #75445a;
      background: radial-gradient(circle at top left, #ffe1ed, transparent 42%),
                  linear-gradient(145deg, #fff9fc, #fce8f1);
    }
    .card {
      width: min(100%, 390px); padding: 36px 26px; text-align: center;
      background: rgba(255,255,255,.82); border: 1px solid #f5d5e2;
      border-radius: 28px; box-shadow: 0 18px 55px rgba(177, 91, 130, .12);
    }
    .heart { font-size: 28px; margin-bottom: 14px; }
    h1 { margin: 0 0 9px; font-size: 23px; font-weight: 650; }
    p { margin: 0 0 22px; color: #a47a8d; font-size: 14px; }
    input {
      width: 100%; padding: 14px 15px; border: 1px solid #edc7d8;
      border-radius: 14px; background: #fffafd; color: #75445a;
      font-size: 16px; text-align: center; outline: none;
    }
    input:focus { border-color: #d98eaf; box-shadow: 0 0 0 3px #fbe4ee; }
    button {
      width: 100%; margin-top: 13px; padding: 14px; border: 0;
      border-radius: 14px; background: #d98eaf; color: white;
      font-size: 15px; font-weight: 650; cursor: pointer;
    }
    button:hover { background: #ca789d; }
    #error { min-height: 20px; margin: 12px 0 0; color: #bb547b; font-size: 13px; }
    #note { display: none; padding: 16px 0 4px; }
    #note h2 { margin: 0 0 10px; color: #b65f89; font-size: 30px; }
    #note .signature { color: #b65f89; font-size: 17px; }
    .tiny-heart { margin-top: 19px; color: #d98eaf; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">♡</div>
    <section id="login">
      <h1>Bu not sana özel</h1>
      <p>Devam etmek için şifreyi gir.</p>
      <form id="form">
        <input id="password" type="password" placeholder="Şifre" autocomplete="off" aria-label="Şifre">
        <button type="submit">Aç 💗</button>
      </form>
      <div id="error" role="status"></div>
    </section>
    <section id="note" aria-live="polite">
      <h2>mal kuzey</h2>
      <div class="signature">- yağız</div>
      <div class="tiny-heart">♡</div>
    </section>
  </main>
  <script>
    const correctPassword = "01.11.2008";
    document.getElementById("form").addEventListener("submit", function (event) {
      event.preventDefault();
      const entered = document.getElementById("password").value;
      if (entered === correctPassword) {
        document.getElementById("login").style.display = "none";
        document.getElementById("note").style.display = "block";
      } else {
        document.getElementById("error").textContent = "Şifre yanlış, tekrar dene.";
      }
    });
  </script>
</body>
</html>
